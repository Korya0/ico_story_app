name: ico_story_app
description: "ICO Stories App - Educational stories for children"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

# ═══════════════════════════════════════════════
# 📦 App Dependencies
# ═══════════════════════════════════════════════
dependencies:
  flutter:
    sdk: flutter

  # ─── UI / Layout ──────────────────────────────
  animate_do: ^4.2.0
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.1

  # ─── Navigation ───────────────────────────────
  go_router: ^16.2.1

  # ─── State Management ─────────────────────────
  flutter_bloc: ^9.0.0

  # ─── Audio / PDF / Page Flip ──────────────────
  audioplayers: ^5.2.1
  just_audio: ^0.9.36
  flutter_pdfview: 1.3.2
  page_flip: ^0.2.5+1
  pdfx: ^2.9.2

  # ─── Utilities ────────────────────────────────
  url_launcher: ^6.3.2
  logger: ^2.5.0
  shared_preferences: any
  path_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0

# ═══════════════════════════════════════════════
# 🎨 Flutter Configuration
# ═══════════════════════════════════════════════
flutter:
  uses-material-design: true

  # ─── Assets ───────────────────────────────────
  assets:
    # Images
    - assets/images/app/
    - assets/images/onboarding/
    - assets/images/labels/
    - assets/svgs/
    - assets/images/covers/char/
    - assets/images/covers/tarbawia/
    - assets/images/covers/sira/

    # Audio
    - assets/audio/tarbawia/
    - assets/audio/char/

    # PDF
    - assets/pdf/tarbawia/
    - assets/pdf/char/
    - assets/pdf/sira/

  # ─── Fonts ────────────────────────────────────
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 900
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 100
